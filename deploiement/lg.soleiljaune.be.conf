# nginx de l'hôte — /etc/nginx/sites-available/lg.soleiljaune.be
#
# Le certificat Let's Encrypt s'obtient AVANT d'activer le bloc TLS :
#   certbot certonly --nginx -d lg.soleiljaune.be
# puis « ln -s » vers sites-enabled et « nginx -t && systemctl reload nginx ».

server {
    listen 80;
    listen [::]:80;
    server_name lg.soleiljaune.be;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lg.soleiljaune.be;

    ssl_certificate     /etc/letsencrypt/live/lg.soleiljaune.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lg.soleiljaune.be/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Les cartes secrètes ne doivent jamais finir dans un cache
    # intermédiaire : le serveur renvoie un contenu différent selon
    # le jeton d'appareil de chaque joueur.
    proxy_cache off;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Les fichiers construits par Vite portent une empreinte dans leur nom :
    # ils peuvent être mis en cache longtemps sans risque.
    location /assets/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

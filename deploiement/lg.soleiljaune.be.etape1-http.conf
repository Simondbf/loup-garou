# ÉTAPE 1 sur 2 — configuration temporaire, sans TLS.
#
# Certbot ne peut pas obtenir de certificat pour un domaine que nginx ne
# connaît pas encore : il répond alors 404 au défi ACME. Il faut donc
# installer CE fichier d'abord, recharger nginx, demander le certificat,
# puis seulement le remplacer par lg.soleiljaune.be.conf.
#
# /etc/nginx/sites-available/lg.soleiljaune.be

server {
    listen 80;
    listen [::]:80;
    server_name lg.soleiljaune.be;

    # Emplacement où Certbot dépose son fichier de vérification.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
